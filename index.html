<script>
(()=>{'use strict';
const W=1280,H=720,c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),mute=document.getElementById('mute'),pauseBtn=document.getElementById('pause');

let commentaryText='',commentaryTimer=0,commentaryCool=0,refWarning=0;let audio=null,soundOn=true,scene='menu',time=0,last=0,round=0,player=null,foe=null,pinState=null,particles=[],texts=[],shakes=0,flash=0,impactEffect=null,announcer='',announceTimer=0,matchSeconds=0,roundDelay=0,entranceLength=0,confetti=[],score=0,pauseReturn='fight';

function shout(s,sec=2.5,force=false){if(!force&&commentaryCool>0)return;commentaryText=s;commentaryTimer=sec;commentaryCool=force?1.4:3.6}
function pun(f){if(!f)return '';switch(f.bio.name){case 'ANTH WEIR':return 'ANTH WEIR HAS LOST HIS COMPOSURE! OH WAIT, HE NEVER HAD ANY!';case 'OWEN STRINGER':return 'OWEN STRINGER HAS BEEN UNSTRUNG!';case 'MARTY ALLEN':return 'MARTY ALLEN? THE PARTY HAS BEEN CANCELLED!';case 'JOHN DRAPER':return 'THE BIG LAD HAS BEEN LAID OFF!';case 'BRAD DAVIS':return 'BRAD DAVIS HAS FAILED HIS OWN SAFETY INSPECTION!';default:return 'EUAN HAS BEEN EUAN-HANDLED!'}}

{first:'EUAN',last:'THE UNSTOPPABLE',name:'EUAN',primary:'#20d5ed',secondary:'#0b6d9c',skin:'#f4ba8a',hair:'#5a2b1a',accent:'#ffffff',move:'COMEDY OF ERRORS',weight:1.03},
{first:'ANTH',last:'THE IRON WEIR',name:'ANTH WEIR',primary:'#cb4bdf',secondary:'#54227e',skin:'#d6a07f',hair:'#2d2021',accent:'#ffdb7d',move:'THE DEATH FART',weight:1.10},
{first:'OWEN',last:'THE STRING SLINGER',name:'OWEN STRINGER',primary:'#6aed5b',secondary:'#236a4a',skin:'#e8b291',hair:'#5b3722',accent:'#faff8a',move:'ULTIMATE ANGER',weight:.96},
{first:'MARTY',last:'THE PARTY STARTER',name:'MARTY ALLEN',primary:'#f75c96',secondary:'#85266e',skin:'#c58b66',hair:'#302725',accent:'#ffe8c4',move:'MONEY TALKS',weight:1.05},
{first:'JOHN',last:'THE BIG LAD',name:'JOHN DRAPER',primary:'#28293e',secondary:'#0e1021',skin:'#d8a17f',hair:'#28201e',accent:'#ffca48',move:'THE DRAPER DROP',weight:1.23},
{first:'BRAD',last:'THE CSCS ENFORCER',name:'BRAD DAVIS',primary:'#fa9d25',secondary:'#443557',skin:'#e5aa82',hair:'#222027',accent:'#fff4a9',move:'THE CARD CONFISCATOR',weight:1.27}
];
const makeFighter=(bio,x,isPlayer)=>({bio,x,y:0,vy:0,vx:0,face:isPlayer?1:-1,health:100,maxHealth:100,head:100,body:100,legs:100,stamina:100,special:isPlayer?22:0,climb:0,corner:0,dive:0,diveTotal:0,diveStart:0,diveTarget:0,diveHit:false,groin:0,recovering:0,attack:0,attackDuration:0,attackType:'',attackLanded:false,hitTimer:0,invuln:0,knock:0,ko:false,guard:false,combo:0,lastHitAt:-10,AIcool:1.15,AIblock:0,step:0,breath:0,isPlayer,drag:0,stun:0,roar:0});
function sfx(f=250,d=.1,type='square',gain=.055,end=f*.5){if(!soundOn)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let osc=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;osc.type=type;osc.frequency.setValueAtTime(f,t);osc.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+d);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);osc.connect(g).connect(audio.destination);osc.start(t);osc.stop(t+d+.006)}catch(e){}}
function crowdRoar(){sfx(82,.6,'sawtooth',.035,45);setTimeout(()=>sfx(190,.32,'triangle',.03,120),140)}

function showInstallHelp(){openPanel(`<div class="eyebrow">IPHONE EDITION</div><div class="trophy">📱🥊</div><div class="logo"><span>INSTALL</span><br>THE MADNESS!</div><p class="desc">Open this game in <b>Safari</b> (not the WhatsApp built-in browser). Tap the <b>Share</b> button, then <b>Add to Home Screen</b>. Turn on <b>Open as Web App</b> if shown, and tap <b>Add</b>. The championship icon will appear on your iPhone!</p><button class="action" id="installBack">BACK TO THE RING</button><p class="tiny">Totally free • No App Store • No adverts</p>`);document.getElementById('installBack').onclick=menu}
function menu(){scene='menu';round=0;score=0;openPanel(`<div class="eyebrow">★ THE MAIN EVENT ★</div><div class="trophy">🏆</div><div class="logo">EUAN'S<br><span>WRESTLING</span><br>CHAMPIONSHIP</div><div class="tagline">GO! • BELT OR NOTHING</div><p class="desc">Fight Anth Weir, Owen Stringer, Marty Allen and John Draper, then secret final boss Brad Davis in his flash car. Land massive slams and pin them for the 3-count. Climb the corner ropes and FROG SPLASH! Charge lightning for <b>COMEDY OF ERRORS!</b> There's even a naughty LOW BLOW.</p><div class="menu-roster"><div class="roster-card"><b>EUAN</b><span>COMEDY OF ERRORS</span></div><div class="roster-card"><b>ANTH WEIR</b><span>THE DEATH FART</span></div><div class="roster-card"><b>OWEN</b><span>ULTIMATE ANGER</span></div><div class="roster-card"><b>MARTY</b><span>MONEY TALKS</span></div><div class="roster-card"><b>BIG LAD</b><span>THE DRAPER DROP</span></div><div class="roster-card"><b>??? BOSS</b><span>SECRET CHALLENGER</span></div></div><div class="pin-note">HEAD • BODY • LEGS — WEAR THEM DOWN BEFORE YOU GO FOR THE PIN!</div><button class="action" id="startGame">ENTER THE RING ⚡</button><div><button class="action secondary" id="iphoneInstall" style="margin-top:14px;font-size:15px;min-width:230px">📲 INSTALL ON IPHONE</button></div><div class="keys"><b>← → / A D MOVE</b><b>W JUMP / CLIMB / SPLASH</b><b>U LOW BLOW</b><b>J HIT</b><b>K SLAM</b><b>L PIN</b><b>I FINISH</b><b>SHIFT BLOCK</b></div><p class="tiny">Playable on PC and touchscreen • A comedy arcade game • Names are for fun, not real likenesses</p>`);document.getElementById('startGame').onclick=()=>startRound(1);document.getElementById('iphoneInstall').onclick=showInstallHelp}
function startRound(n){round=n;player=makeFighter(fighters[0],375,true);foe=makeFighter(fighters[n],920,false);pinState=null;particles=[];texts=[];confetti=[];matchSeconds=0;scene='entrance';commentaryText='';commentaryTimer=0;commentaryCool=0;roundDelay=n===5?12.8:n===1?7.8:n===4?6.6:4.6;entranceLength=roundDelay;player.x=75;foe.x=1250;announce(`ROUND ${round} — EUAN VS ${foe.bio.name}!`,3);overlay.classList.add('hidden');shout(introQuip(foe),3.8,true);if(n===4){sfx(77,1.2,'sawtooth',.10,37);setTimeout(()=>sfx(98,.85,'square',.05,47),740);setTimeout(()=>sfx(160,.8,'sawtooth',.085,60),1850);setTimeout(()=>sfx(72,1,'sawtooth',.075,35),2980)}else{sfx(440,.18,'triangle',.07,750);sfx(650,.32,'triangle',.055,320)}}

function getCorner(f){return f.x<ringLeft+92?ringLeft+5:f.x>ringRight-92?ringRight-5:0}
function beginDive(f){
 if(f.climb<=0||f.dive>0)return false;
 const opp=f===player?foe:player;
 f.dive=1.30;f.diveTotal=1.30;f.diveStart=f.x;f.diveTarget=clamp(opp.x,ringLeft+62,ringRight-62);f.climb=0;f.y=0;f.vx=0;f.face=f.diveTarget>=f.x?1:-1;
 shout('FROG SPLASH! AIRBORNE AND ENTIRELY UNINSURED!',2.8,true);sfx(560,.42,'sawtooth',.05,160);return true
}
function doMove(f,kind){
 if(scene!=='fight'||pinState||f.dive>0)return false;
 const opp=f===player?foe:player,dist=Math.abs(f.x-opp.x);
 if(kind==='jump'){
   if(f.climb>0)return beginDive(f);
